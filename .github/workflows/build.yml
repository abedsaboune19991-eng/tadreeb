name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tadreeb.apk
          cp funoon/build/outputs/apk/debug/funoon-debug.apk Funoon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            Tadreeb.apk
            Funoon.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: تطبيقات التدريب ${{ github.run_number }}
          files: |
            Tadreeb.apk
            Funoon.apk
